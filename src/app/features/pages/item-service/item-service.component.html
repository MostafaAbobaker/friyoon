<div class="row g-3">
  @for(item of itemsService ;track item.id) {
  <div class="col-lg-4">
    <a class="card-service" routerLink="/service-details/{{ item.id }}">
      @for(imageItem of item.images; track imageItem.id; let i = $index) {
        @if ( i == 0 ) {
      <img src="{{ imageURL + imageItem.imagePath }} " class="card-img-top"
        alt="..." />
      }
    }
      <p>
        {{ item.nameAr }}
      </p>
    </a>
  </div>
  }
</div>
